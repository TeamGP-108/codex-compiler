[package]
name = "bangla-judge/codex-compiler"
version = "1.0.0"
description = "একটি সম্পূর্ণ বাংলা ভাষায় তৈরি অনলাইন জাজ সিস্টেম"
license = "MIT"

[wasmer]
is_wasmer = true

[command]
name = "codex-compiler"
module = "app.main:app"
runner = "python"

[[endpoint]]
path = "/"
method = "GET"

[[endpoint]]
path = "/execute"
method = "POST"

[[endpoint]]
path = "/submit"
method = "POST"

[[endpoint]]
path = "/submission/{id}"
method = "GET"

[[endpoint]]
path = "/languages"
method = "GET"

[[endpoint]]
path = "/stats"
method = "GET"

[[endpoint]]
path = "/health"
method = "GET"

[env]
WASMER_ENV = "production"
PYTHONUNBUFFERED = "1"
PYTHON_VERSION = "3.12"  # Python 3.12 এ ডাউনগ্রেড

[limits]
timeout = "30s"
memory = "256MB"
